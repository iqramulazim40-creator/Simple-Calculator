<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">

    <div style="width: 700px; margin: 50px auto; padding: 50px; border: 2px solid 
    rgb(2, 2, 19); border-radius: 5px; color: blue;">

        <h1>Calculator</h1>

        <input 
            type="number" 
            id="num1" 
            placeholder="Enter first number"
            style="width: 90%; padding: 15px; margin: 10px; font-size: 20px; color: blue;"
        >

        <input 
            type="number" 
            id="num2" 
            placeholder="Enter second number"
            style="width: 90%; padding: 15px; margin: 10px; font-size: 20px; color: blue;"
        >

        <br>

        <button 
            onclick="add()"
            style="padding: 15px 25px; margin: 10px; font-size: 20px; background-color: blue; color: white; cursor: pointer;"
        >+</button>

        <button 
            onclick="subtract()"
            style="padding: 15px 25px; margin: 10px; font-size: 20px; background-color: blue; color: white; cursor: pointer;"
        >-</button>

        <button 
            onclick="multiply()"
            style="padding: 15px 25px; margin: 10px; font-size: 20px; background-color: blue; color: white; cursor: pointer;"
        >*</button>

        <button 
            onclick="divide()"
            style="padding: 15px 25px; margin: 10px; font-size: 20px; background-color: blue; color: white; cursor: pointer;"
        >/</button>

        <h2 
            id="result"
            style="font-size: 25px; margin-top: 20px; color: blue;"
        >Result:</h2>

    </div>

    <script src="JavaScript .js"></script>

</body>

</html>
